<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .test-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: #5bbd56;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .test-btn:hover {
      background-color: #4CAF50;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="test-btn" onclick="window.open('tests.html', '_blank', 'width=800,height=600')">TEST</button>
    <h1>Tic-Tac-Toe</h1>

    <div class="status" id="status">Player X's turn</div>

    <div class="board" id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <div class="actions">
      <button class="btn" id="restart">New Game</button>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard hidden" id="scoreboard">
      <div class="score">
        <span class="score-label cat-color">🐱 Cat</span>
        <span class="score-value" id="score-cat">0</span>
      </div>
      <div class="score">
        <span class="score-label dog-color">🐶 Dog</span>
        <span class="score-value" id="score-dog">0</span>
      </div>
    </div>
  </div>

  <!-- Mode selection modal (shown before the first game) -->
  <div class="modal-overlay" id="mode-modal">
    <div class="modal">
      <h2>Como você quer jogar?</h2>
      <p class="modal-hint">Escolha o modo antes de começar.</p>
      <button class="btn btn-primary" id="btn-championship">🏆 Iniciar Campeonato</button>
      <button class="btn btn-secondary" id="btn-freeplay">Jogar Livre (sem placar)</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="script.js"></script>
</body>
</html>
